name: Publish daily cybersecurity brief

on:
  push:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test rotation
        run: node --test
      - name: Update today's feature
        if: github.event_name == 'schedule'
        run: |
          node scripts/publish.js
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add current.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily cybersecurity brief for $(date -u +%F)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
